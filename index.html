<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#06020f">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">

<title>Gravity Flip Runner</title>

<style>

html,
body {
    margin: 0;
    height: 100%;
    background: #06020f;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: system-ui, sans-serif;
    color: #fff;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#ui {
    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background: rgba(6, 2, 15, .72);

    transition: opacity .25s;

    padding: 16px;
    box-sizing: border-box;

    z-index: 10;
}

#ui.h {
    opacity: 0;
    pointer-events: none;
}

h1 {
    font-size: clamp(34px, 9vw, 78px);

    margin: 0;

    letter-spacing: .1em;

    background: linear-gradient(90deg, #0ff, #f0f);

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    filter: drop-shadow(0 0 18px #f0f8);
}

p {
    opacity: .85;

    margin: 8px 0;

    line-height: 1.5;
}

.b {
    font: 700 22px system-ui;

    letter-spacing: .15em;

    color: #0ff;

    border: 2px solid #0ff;

    border-radius: 50px;

    padding: 12px 44px;

    margin-top: 14px;

    background: #0ff1;

    box-shadow:
        0 0 22px #0ff6,
        inset 0 0 14px #0ff3;

    animation: p 1.2s infinite alternate;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;

    transition:
        transform .12s ease,
        background .12s ease;
}

.b:hover {
    background: #0ff3;
}

.b:active {
    transform: scale(.96);
}

@keyframes p {
    to {
        transform: scale(1.06);
    }
}

</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="ui">

    <h1 id="t">GRAVITY FLIP</h1>

    <p id="m"></p>

    <div
        class="b"
        id="go"
        role="button"
        tabindex="0"
    >
        TAP TO RUN
    </div>

    <p style="font-size:14px;margin-top:18px">
        Tap · click · Space · ↑ to flip gravity<br>
        Dodge spikes, walls &amp; saws · grab orbs · speed keeps rising
    </p>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const c = document.getElementById('c');
const x = c.getContext('2d');

const ui = document.getElementById('ui');
const M = document.getElementById('m');
const T = document.getElementById('t');
const GO = document.getElementById('go');

let W, H, top, bot;

const R = Math.random;
const TAU = Math.PI * 2;


/* =========================================================
   RESIZE
========================================================= */

function rs() {

    const D = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    c.width = W * D;
    c.height = H * D;

    x.setTransform(
        D,
        0,
        0,
        D,
        0,
        0
    );

    top = Math.max(40, H * .1);
    bot = H - top;
}

window.addEventListener('resize', rs);

rs();


/* =========================================================
   GAME STATE
========================================================= */

let S = 'menu';

let hi = 0;

try {

    hi = +(localStorage.getItem('gf_hi') || 0);

} catch (e) {

    hi = 0;

}

let py,
    vy,
    dir,
    rot,
    grounded,
    buf,
    t,
    dist,
    orbsN,
    score,
    O,
    Ob,
    F,
    gap,
    shake,
    flash,
    deadT,
    slow,
    combo;


/* =========================================================
   STAR FIELD
========================================================= */

const stars = Array.from(
    { length: 70 },
    () => ({
        x: R() * window.innerWidth,
        y: R() * window.innerHeight,
        z: .3 + R()
    })
);


/* =========================================================
   AUDIO
========================================================= */

let A;

function snd(
    f,
    d,
    type = 'square',
    v = .04,
    s = 0
) {

    try {

        A =
            A ||
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        if (A.state === 'suspended') {
            A.resume();
        }

        const o = A.createOscillator();

        const g = A.createGain();

        const n = A.currentTime;

        o.type = type;

        o.frequency.setValueAtTime(
            f,
            n
        );

        o.frequency.exponentialRampToValueAtTime(
            Math.max(20, f * (1 + s)),
            n + d
        );

        g.gain.setValueAtTime(
            v,
            n
        );

        g.gain.exponentialRampToValueAtTime(
            .001,
            n + d
        );

        o.connect(g).connect(A.destination);

        o.start();

        o.stop(n + d);

    } catch (e) {

        /* Audio is optional */

    }

}


/* =========================================================
   GAME CONSTANTS
========================================================= */

const px = () =>
    Math.min(W * .25, 220);

const acc = () =>
    2 * (bot - top - 28) / .09;

const spd = () =>
    380 + Math.min(t * 7, 460);


/* =========================================================
   INITIALIZE GAME
========================================================= */

function init() {

    py = bot - 14;

    vy = 0;

    dir = 1;

    rot = 0;

    grounded = true;

    buf = 0;

    t = 0;

    dist = 0;

    orbsN = 0;

    score = 0;

    O = [];

    Ob = [];

    F = [];

    gap = W * .5;

    shake = 0;

    flash = 0;

    deadT = 0;

    slow = 1;

    combo = 0;

    S = 'play';

    ui.classList.add('h');

}


/* =========================================================
   GAME OVER
========================================================= */

function die() {

    S = 'dead';

    deadT = 0;

    slow = .25;

    shake = 22;

    flash = .8;

    boom(
        px(),
        py,
        '#fff',
        50,
        420
    );

    snd(
        80,
        .6,
        'sawtooth',
        .12,
        -.7
    );

    if (
        navigator.vibrate
    ) {

        navigator.vibrate(80);

    }

    if (score > hi) {

        hi = score;

        try {

            localStorage.setItem(
                'gf_hi',
                hi
            );

        } catch (e) {

            /* Storage unavailable */

        }

    }

}


/* =========================================================
   SHOW GAME OVER
========================================================= */

function showEnd() {

    T.textContent = 'CRASHED';

    M.innerHTML =
        '<b style="font-size:30px">' +
        score +
        '</b><br>Orbs ' +
        orbsN +
        ' · Best ' +
        hi;

    GO.textContent = 'TAP TO RETRY';

    ui.classList.remove('h');

}


/* =========================================================
   PARTICLES
========================================================= */

function boom(
    X,
    Y,
    col,
    n = 14,
    sp = 240
) {

    for (
        let i = 0;
        i < n;
        i++
    ) {

        const a =
            R() * TAU;

        const s =
            R() * sp;

        F.push({

            x: X,

            y: Y,

            vx: Math.cos(a) * s,

            vy: Math.sin(a) * s,

            l: .4 + R() * .6,

            m: 1,

            c: col

        });

    }

}


/* =========================================================
   FLIP / START / RETRY
========================================================= */

function flip() {

    /*
       MENU
       ----
       Start the game.
    */

    if (S === 'menu') {

        init();

        return;

    }


    /*
       DEAD
       ----
       Restart after death animation.
    */

    if (
        S === 'dead' &&
        deadT > .7
    ) {

        init();

        return;

    }


    /*
       PLAY
       ----
       Flip gravity.
    */

    if (S === 'play') {

        buf = .14;

    }

}


/* =========================================================
   MAIN BUTTON
========================================================= */

/*
   CLICK EVENT
   Works reliably on Safari,
   Chrome, Firefox and desktop.
*/

GO.addEventListener(
    'click',
    function(e) {

        e.preventDefault();

        e.stopPropagation();

        flip();

    }
);


/*
   POINTER EVENT
   Useful for touch devices.

   We don't call flip() here because
   Safari may generate both pointerdown
   and click, which could cause TWO flips.
*/

GO.addEventListener(
    'pointerdown',
    function(e) {

        e.preventDefault();

        e.stopPropagation();

    }
);


/*
   KEYBOARD ACCESSIBILITY
*/

GO.addEventListener(
    'keydown',
    function(e) {

        if (
            e.key === 'Enter' ||
            e.key === ' '
        ) {

            e.preventDefault();

            flip();

        }

    }
);


/* =========================================================
   SCREEN CONTROLS
========================================================= */

window.addEventListener(
    'pointerdown',
    function(e) {

        /*
           If the user clicks the button,
           the button handles it separately.
        */

        if (
            e.target === GO ||
            GO.contains(e.target)
        ) {

            return;

        }

        e.preventDefault();

        flip();

    },
    { passive: false }
);


/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

window.addEventListener(
    'keydown',
    function(e) {

        if (
            e.key === ' ' ||
            e.key === 'ArrowUp' ||
            e.key === 'ArrowDown' ||
            e.key === 'Enter'
        ) {

            e.preventDefault();

            if (!e.repeat) {

                flip();

            }

        }

    }
);


/* =========================================================
   INITIAL UI
========================================================= */

M.innerHTML =
    'Best ' + hi;


/* =========================================================
   SPAWN OBJECTS
========================================================= */

function spawn() {

    const X = W + 60;

    const r = R();

    const L = bot - top;

    const side =
        R() < .5
            ? 1
            : -1;

    let sp =
        .55 + R() * .45;


if (r < .34) {

        const n =
            1 + (R() * 3 | 0);

        Ob.push({

            k: 's',

            x: X,

            w: 30 * n,

            h: 34,

            side

        });

        sp += n * .06;

    }

    else if (r < .58) {

        Ob.push({

            k: 'w',

            x: X,

            w: 38,

            h: L * (.4 + R() * .15),

            side

        });

    }

    else if (r < .78) {

        Ob.push({

            k: 'o',

            x: X,

            r: 20,

            ph: R() * 6,

            amp: L * .32

        });

    }

    else {

        Ob.push({

            k: 'w',

            x: X,

            w: 38,

            h: L * .45,

            side

        });

        Ob.push({

            k: 'w',

            x: X + spd() * .62,

            w: 38,

            h: L * .45,

            side: -side

        });

        sp += .45;

    }


    if (R() < .6) {

        O.push({

            x:
                X +
                spd() *
                sp *
                .5,

            y:
                R() < .5
                    ? top + 26
                    : bot - 26,

            r: 11,

            ph: R() * 6

        });

    }


    gap =
        spd() *
        (.5 + sp * .7);

}


/* =========================================================
   COLLISION DETECTION
========================================================= */

function hit(b) {

    const X = px() - 12;

    const Y = py - 12;

    const w = 24;

    const h = 24;


    /*
       ORB
    */

    if (b.k === 'o') {

        const cy =
            (top + bot) / 2 +
            Math.sin(b.ph) * b.amp;

        const dx =
            Math.max(
                X,
                Math.min(
                    b.x,
                    X + w
                )
            ) - b.x;

        const dy =
            Math.max(
                Y,
                Math.min(
                    cy,
                    Y + h
                )
            ) - cy;

        return (
            dx * dx +
            dy * dy <
            (b.r - 3) ** 2
        );

    }


    let y0, y1;

    const base =
        b.side === 1
            ? bot
            : top;


    /*
       SPIKE
    */

    if (b.k === 's') {

        const hh =
            b.h * .7;

        y0 =
            b.side === 1
                ? base - hh
                : base;

        y1 =
            b.side === 1
                ? base
                : base + hh;

        return (
            X + w > b.x + 4 &&
            X < b.x + b.w - 4 &&
            Y + h > y0 &&
            Y < y1
        );

    }


    /*
       WALL
    */

    y0 =
        b.side === 1
            ? base - b.h
            : base;

    y1 =
        b.side === 1
            ? base
            : base + b.h;

    return (
        X + w > b.x &&
        X < b.x + b.w &&
        Y + h > y0 &&
        Y < y1
    );

}


/* =========================================================
   UPDATE GAME
========================================================= */

function up(dt) {

    t += dt;

    dist +=
        spd() * dt;

    buf -= dt;


    /*
       GRAVITY FLIP
    */

    if (
        buf > 0 &&
        grounded
    ) {

        dir *= -1;

        vy = dir * 140;

        grounded = false;

        buf = 0;

        snd(
            dir > 0
                ? 300
                : 500,
            .12,
            'square',
            .03,
            .6
        );

        boom(
            px(),
            py,
            '#fff',
            6,
            120
        );

        shake =
            Math.max(
                shake,
                3
            );

    }


    /*
       GRAVITY
    */

    vy +=
        dir *
        acc() *
        dt;

    py +=
        vy *
        dt;


    /*
       ROTATION
    */

    rot +=
        (
            (dir > 0 ? 0 : Math.PI) -
            rot
        ) *
        Math.min(
            1,
            dt * 14
        );


    /*
       BOTTOM GROUND
    */

    if (
        dir === 1 &&
        py >= bot - 14
    ) {

        py = bot - 14;

        if (!grounded) {

            boom(
                px(),
                py + 14,
                '#0ff',
                8,
                140
            );

            shake =
                Math.max(
                    shake,
                    2
                );

        }

        vy = 0;

        grounded = true;

    }


    /*
       TOP GROUND
    */

    if (
        dir === -1 &&
        py <= top + 14
    ) {

        py = top + 14;

        if (!grounded) {

            boom(
                px(),
                py - 14,
                '#0ff',
                8,
                140
            );

            shake =
                Math.max(
                    shake,
                    2
                );

        }

        vy = 0;

        grounded = true;

    }


    /*
       SPAWNING
    */

    gap -=
        spd() * dt;

    if (gap <= 0) {

        spawn();

    }


    /*
       MOVE OBJECTS
    */

    const d =
        spd() * dt;


    for (const b of Ob) {

        b.x -= d;

        if (b.k === 'o') {

            b.ph +=
                dt *
                (2 + t * .04);

        }

    }


    for (const o of O) {

        o.x -= d;

        o.ph += dt * 4;

    }


    /*
       PLAYER TRAIL
    */

    F.push({

        x: px() - 10,

        y:
            py +
            (Math.random() - .5) * 14,

        vx:
            -spd() * .5,

        vy:
            (R() - .5) * 40,

        l: .35,

        m: .35,

        c: '#0af'

    });


    /*
       COLLISIONS
    */

    for (const b of Ob) {

        if (hit(b)) {

            die();

            return;

        }

    }


    /*
       ORB COLLECTION
    */

    for (const o of O) {

        if (
            !o.d &&
            Math.hypot(
                o.x - px(),
                o.y - py
            ) < 26
        ) {

            o.d = 1;

            orbsN++;

            combo++;

            boom(
                o.x,
                o.y,
                '#ff0',
                10,
                160
            );

            snd(
                700 + combo * 40,
                .15,
                'sine',
                .07,
                .8
            );

        }

    }


    /*
       CLEANUP
    */

    Ob = Ob.filter(
        b =>
            b.x +
            (b.w || 40) >
            -60
    );

    O = O.filter(
        o =>
            !o.d &&
            o.x > -30
    );


    /*
       SCORE
    */

    score =
        (dist / 60 | 0) +
        orbsN * 10;

}


/* =========================================================
   GLOW
========================================================= */

function glow(
    col,
    w = 2
) {

    x.globalAlpha = .25;

    x.strokeStyle = col;

    x.lineWidth = w * 3.5;

    x.stroke();

    x.globalAlpha = 1;

    x.lineWidth = w;

    x.stroke();

}


/* =========================================================
   DRAW
========================================================= */

function draw(dt) {

    const hue =
        (t * 6 + 200) % 360;

    const c1 =
        `hsl(${hue},100%,60%)`;

    const c2 =
        `hsl(${(hue + 150) % 360},100%,62%)`;


    /*
       BACKGROUND
    */

    x.globalCompositeOperation =
        'source-over';


    const g =
        x.createLinearGradient(
            0,
            0,
            0,
            H
        );

    g.addColorStop(
        0,
        `hsl(${hue},60%,10%)`
    );

    g.addColorStop(
        1,
        `hsl(${(hue + 60) % 360},60%,6%)`
    );

    x.fillStyle = g;

    x.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       SCREEN SHAKE
    */

    x.save();

    if (shake > .4) {

        x.translate(
            (R() - .5) * shake,
            (R() - .5) * shake
        );

        shake *= .88;

    }


    const sp =
        S === 'play' ||
        S === 'dead'
            ? spd()
            : 120;


    /*
       STARS
    */

    x.fillStyle = '#fff';

    for (const s of stars) {

        s.x -=
            s.z *
            sp *
            .12 *
            dt;

        if (s.x < 0) {

            s.x = W;

            s.y = R() * H;

        }

        x.globalAlpha =
            .25 +
            s.z * .3;

        x.fillRect(
            s.x,
            s.y,
            s.z * 2 +
            sp * .004,
            s.z * 1.5
        );

    }

    x.globalAlpha = 1;


    /*
       GRID
    */

    x.globalCompositeOperation =
        'lighter';

    x.strokeStyle = c1;

    x.globalAlpha = .08;

    x.lineWidth = 1;

    const off =
        (dist * .5) % 90;

    for (
        let i = -1;
        i < W / 90 + 1;
        i++
    ) {

        x.beginPath();

        x.moveTo(
            i * 90 - off,
            top
        );

        x.lineTo(
            i * 90 - off,
            bot
        );

        x.stroke();

    }

    x.globalAlpha = 1;


    /*
       TRACK BOUNDARIES
    */

    x.beginPath();

    x.moveTo(
        0,
        top
    );

    x.lineTo(
        W,
        top
    );

    x.moveTo(
        0,
        bot
    );

    x.lineTo(
        W,
        bot
    );

    glow(
        c1,
        3
    );


    /*
       ORBS
    */

    for (const o of O) {

        x.beginPath();

        x.arc(
            o.x,
            o.y,
            o.r +
            Math.sin(o.ph) * 2,
            0,
            TAU
        );

        glow(
            '#ff0'
        );

        x.fillStyle = '#ff0';

        x.globalAlpha = .4;

        x.fill();

        x.globalAlpha = 1;

    }


    /*
       OBSTACLES
    */

    for (const b of Ob) {

        x.beginPath();


        /*
           SPIKES
        */

        if (b.k === 's') {

            const n =
                Math.round(
                    b.w / 30
                );

            const base =
                b.side === 1
                    ? bot
                    : top;


            for (
                let i = 0;
                i < n;
                i++
            ) {

                x.moveTo(
                    b.x + i * 30,
                    base
                );

                x.lineTo(
                    b.x +
                    i * 30 +
                    15,
                    base -
                    b.side *
                    b.h
                );

                x.lineTo(
                    b.x +
                    i * 30 +
                    30,
                    base
                );

            }

            x.closePath();

            glow(
                '#f33',
                2
            );

            x.fillStyle = '#f33';

            x.globalAlpha = .3;

            x.fill();

            x.globalAlpha = 1;

        }


        /*
           WALL
        */

        else if (b.k === 'w') {

            const y =
                b.side === 1
                    ? bot - b.h
                    : top;

            x.rect(
                b.x,
                y,
                b.w,
                b.h
            );

            glow(
                c2,
                2
            );

            x.fillStyle = c2;

            x.globalAlpha = .22;

            x.fill();

            x.globalAlpha = 1;

        }


        /*
           SAW
        */

        else {

            const cy =
                (top + bot) / 2 +
                Math.sin(b.ph) *
                b.amp;

            x.save();

            x.translate(
                b.x,
                cy
            );

            x.rotate(
                t * 8
            );

            for (
                let i = 0;
                i < 8;
                i++
            ) {

                const a =
                    i * TAU / 8;

                x.lineTo(
                    Math.cos(a) *
                    b.r,
                    Math.sin(a) *
                    b.r
                );

                x.lineTo(
                    Math.cos(
                        a + TAU / 16
                    ) *
                    b.r *
                    .55,
                    Math.sin(
                        a + TAU / 16
                    ) *
                    b.r *
                    .55
                );

            }

            x.closePath();

            glow(
                '#f80',
                2
            );

            x.fillStyle = '#f80';

            x.globalAlpha = .3;

            x.fill();

            x.globalAlpha = 1;

            x.restore();

        }

    }


    /*
       PARTICLES
    */

    for (const f of F) {

        f.x +=
            f.vx * dt;

        f.y +=
            f.vy * dt;

        f.l -= dt;

        x.globalAlpha =
            Math.max(
                0,
                f.l / f.m
            );

        x.fillStyle = f.c;

        x.fillRect(
            f.x - 2,
            f.y - 2,
            4,
            4
        );

    }

    x.globalAlpha = 1;

    F = F.filter(
        f => f.l > 0
    );


    /*
       PLAYER
    */

    if (
        S !== 'dead' &&
        py !== undefined &&
        S !== 'menu'
    ) {

        x.save();

        x.translate(
            px(),
            py
        );

        x.rotate(
            rot +
            (
                grounded
                    ? 0
                    : (
                        dir > 0
                            ? -1
                            : 1
                    ) *
                    Math.min(
                        .5,
                        Math.abs(vy) /
                        2500
                    )
            )
        );


        x.beginPath();

        x.rect(
            -13,
            -13,
            26,
            26
        );

        glow(
            '#0ff',
            3
        );

        x.fillStyle = '#0ff';

        x.globalAlpha = .3;

        x.fill();

        x.globalAlpha = 1;

        x.fillStyle = '#fff';

        x.fillRect(
            2,
            dir > 0 ? -6 : 2,
            7,
            5
        );

        x.restore();

    }


    x.restore();

    x.globalCompositeOperation =
        'source-over';


    /*
       FLASH
    */

    if (flash > 0) {

        x.fillStyle =
            `rgba(255,255,255,${flash * .5})`;

        x.fillRect(
            0,
            0,
            W,
            H
        );

        flash -=
            dt * 2;

    }


    /*
       SCORE UI
    */

    if (
        S === 'play' ||
        S === 'dead'
    ) {

        x.textAlign = 'center';

        x.fillStyle = '#fff';

        x.font =
            '700 30px system-ui';

        x.fillText(
            score,
            W / 2,
            top - 10 < 30
                ? 30
                : top - 12
        );


        x.textAlign = 'left';

        x.font =
            '13px system-ui';

        x.fillStyle = '#aaa';

        x.fillText(
            'BEST ' +
            Math.max(
                hi,
                score
            ) +
            '   ●' +
            orbsN,
            14,
            bot + 30 > H
                ? H - 8
                : bot + 26
        );

    }

}


/* =========================================================
   GAME LOOP
========================================================= */

let last = 0;

function loop(ts) {

    requestAnimationFrame(loop);

    let dt =
        Math.min(
            (ts - last) / 1000 || 0,
            .05
        );

    last = ts;


    /*
       DEATH SLOW MOTION
    */

    if (S === 'dead') {

        deadT += dt;

        slow =
            Math.min(
                1,
                slow + dt * .6
            );

        dt *= slow;


        if (
            deadT > .7 &&
            ui.classList.contains('h')
        ) {

            showEnd();

        }

    }


    /*
       GAME UPDATE
    */

    if (S === 'play') {

        up(dt);

    }


    /*
       DRAW
    */

    draw(dt);

}


/* =========================================================
   START ANIMATION
========================================================= */

requestAnimationFrame(loop);


/* =========================================================
   SERVICE WORKER
========================================================= */

if ('serviceWorker' in navigator) {

    window.addEventListener(
        'load',
        () => {

            navigator.serviceWorker
                .register('sw.js')
                .catch(
                    () => {}
                );

        }
    );

}

</script>
