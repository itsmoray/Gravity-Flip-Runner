<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#06020f">

<title>Gravity Flip Runner</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#06020f;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    font-family:system-ui,sans-serif;
    color:white;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#ui{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:rgba(6,2,15,.72);

    transition:opacity .25s;

    padding:16px;
    box-sizing:border-box;
}

#ui.hidden{
    opacity:0;
    pointer-events:none;
}

h1{
    font-size:clamp(34px,9vw,78px);
    margin:0;
    letter-spacing:.1em;

    background:linear-gradient(90deg,#00ffff,#ff00ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    filter:drop-shadow(0 0 18px #f0f8);
}

p{
    opacity:.85;
    margin:8px 0;
    line-height:1.5;
}

#go{
    font:700 22px system-ui;
    letter-spacing:.15em;

    color:#00ffff;

    border:2px solid #00ffff;
    border-radius:50px;

    padding:12px 44px;
    margin-top:14px;

    background:rgba(0,255,255,.08);

    box-shadow:
        0 0 22px rgba(0,255,255,.4),
        inset 0 0 14px rgba(0,255,255,.2);

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;

    touch-action:manipulation;

    animation:pulse 1.2s infinite alternate;
}

#go:active{
    transform:scale(.96);
}

@keyframes pulse{
    to{
        transform:scale(1.06);
    }
}

#error{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;

    z-index:100;

    display:none;

    padding:12px;

    background:#450000;
    border:1px solid #ff3333;

    color:#ffaaaa;

    font:13px monospace;

    white-space:pre-wrap;

    text-align:left;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="ui">

    <h1 id="title">GRAVITY FLIP</h1>

    <p id="message">Best 0</p>

    <div id="go">TAP TO RUN</div>

    <p style="font-size:14px;margin-top:18px">
        Tap · click · Space · ↑ to flip gravity<br>
        Dodge spikes, walls &amp; saws · grab orbs · speed keeps rising
    </p>

</div>

<div id="error"></div>

<script>

"use strict";

/* =========================================================
   ERROR DISPLAY
========================================================= */

const errorBox = document.getElementById("error");

window.addEventListener("error", function(event){

    errorBox.style.display = "block";

    errorBox.textContent =
        "JavaScript Error:\n" +
        (event.message || "Unknown error") +
        "\nLine: " +
        (event.lineno || "?");

});


window.addEventListener("unhandledrejection", function(event){

    errorBox.style.display = "block";

    errorBox.textContent =
        "JavaScript Error:\n" +
        String(event.reason);

});


/* =========================================================
   ELEMENTS
========================================================= */

const canvas = document.getElementById("c");

const ctx = canvas.getContext("2d");

const ui = document.getElementById("ui");

const title = document.getElementById("title");

const message = document.getElementById("message");

const go = document.getElementById("go");


/* =========================================================
   CANVAS
========================================================= */

let W = 0;
let H = 0;

let top = 0;
let bot = 0;


function resize(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = window.innerWidth;

    H = window.innerHeight;

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    top =
        Math.max(
            40,
            H * .1
        );

    bot =
        H - top;
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   SAFE HIGH SCORE
========================================================= */

let highScore = 0;


function loadHighScore(){

    try{

        const value =
            window.localStorage.getItem(
                "gravity_flip_high_score"
            );

        if(value !== null){

            highScore =
                Number(value) || 0;

        }

    }catch(error){

        highScore = 0;

    }

}


function saveHighScore(){

    try{

        window.localStorage.setItem(
            "gravity_flip_high_score",
            String(highScore)
        );

    }catch(error){

        /* Storage unavailable.
           Game continues normally. */

    }

}


loadHighScore();


/* =========================================================
   GAME STATE
========================================================= */

let state = "menu";

let playerY = 0;
let velocityY = 0;

let direction = 1;

let rotation = 0;

let grounded = true;

let flipBuffer = 0;

let time = 0;

let distance = 0;

let orbCount = 0;

let score = 0;

let obstacles = [];

let orbs = [];

let particles = [];

let spawnGap = 0;

let shake = 0;

let flash = 0;

let deadTimer = 0;

let slowMotion = 1;

let combo = 0;


/* =========================================================
   RANDOM
========================================================= */

const random = Math.random;

const TWO_PI =
    Math.PI * 2;


/* =========================================================
   PLAYER
========================================================= */

function playerX(){

    return Math.min(
        W * .25,
        220
    );

}


/* =========================================================
   SPEED
========================================================= */

function speed(){

    return 380 +
        Math.min(
            time * 7,
            460
        );

}


/* =========================================================
   GRAVITY
========================================================= */

function acceleration(){

    return (
        2 *
        (bot - top - 28)
        / .09
    );

}


/* =========================================================
   AUDIO
========================================================= */

let audio = null;


function sound(
    frequency,
    duration,
    type = "square",
    volume = .04,
    sweep = 0
){

    try{

        const AudioClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioClass){

            return;

        }

        if(!audio){

            audio =
                new AudioClass();

        }

        if(audio.state === "suspended"){

            audio.resume();

        }

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        const now =
            audio.currentTime;

        oscillator.type =
            type;

        oscillator.frequency.setValueAtTime(
            frequency,
            now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            Math.max(
                20,
                frequency * (1 + sweep)
            ),
            now + duration
        );

        gain.gain.setValueAtTime(
            volume,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + duration
        );

        oscillator
            .connect(gain)
            .connect(audio.destination);

        oscillator.start();

        oscillator.stop(
            now + duration
        );

    }catch(error){

        /* Audio is optional */

    }

}


/* =========================================================
   PARTICLES
========================================================= */

function explode(
    x,
    y,
    color,
    count = 14,
    power = 240
){

    for(
        let i = 0;
        i < count;
        i++
    ){

        const angle =
            random() * TWO_PI;

        const velocity =
            random() * power;

        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle) *
                velocity,

            vy:
                Math.sin(angle) *
                velocity,

            life:
                .4 +
                random() * .6,

            maxLife:1,

            color:color

        });

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    playerY =
        bot - 14;

    velocityY = 0;

    direction = 1;

    rotation = 0;

    grounded = true;

    flipBuffer = 0;

    time = 0;

    distance = 0;

    orbCount = 0;

    score = 0;

    obstacles = [];

    orbs = [];

    particles = [];

    spawnGap =
        W * .5;

    shake = 0;

    flash = 0;

    deadTimer = 0;

    slowMotion = 1;

    combo = 0;

    state = "play";

    ui.classList.add(
        "hidden"
    );

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    state = "dead";

    deadTimer = 0;

    slowMotion = .25;

    shake = 22;

    flash = .8;

    explode(
        playerX(),
        playerY,
        "#ffffff",
        50,
        420
    );

    sound(
        80,
        .6,
        "sawtooth",
        .12,
        -.7
    );


    if(
        navigator.vibrate
    ){

        navigator.vibrate(80);

    }


    if(score > highScore){

        highScore =
            score;

        saveHighScore();

    }

}


/* =========================================================
   END SCREEN
========================================================= */

function showEnd(){

    title.textContent =
        "CRASHED";

    message.innerHTML =
        "<b style='font-size:30px'>" +
        score +
        "</b><br>" +
        "Orbs " +
        orbCount +
        " · Best " +
        highScore;

    go.textContent =
        "TAP TO RETRY";

    ui.classList.remove(
        "hidden"
    );

}


/* =========================================================
   FLIP
========================================================= */

function flip(){

    if(state === "menu"){

        startGame();

        return;

    }


    if(
        state === "dead" &&
        deadTimer > .7
    ){

        startGame();

        return;

    }


    if(state === "play"){

        flipBuffer = .14;

    }

}


/* =========================================================
   BUTTON
========================================================= */

go.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        event.stopPropagation();

        flip();

    }
);


/* Touch */

go.addEventListener(
    "touchend",
    function(event){

        event.preventDefault();

        event.stopPropagation();

        flip();

    },
    {
        passive:false
    }
);


/* =========================================================
   GAME AREA INPUT
========================================================= */

window.addEventListener(
    "pointerdown",
    function(event){

        if(
            event.target === go ||
            go.contains(event.target)
        ){

            return;

        }

        if(state === "play"){

            event.preventDefault();

            flip();

        }

    },
    {
        passive:false
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === " " ||
            event.key === "ArrowUp" ||
            event.key === "ArrowDown" ||
            event.key === "Enter"
        ){

            event.preventDefault();

            if(!event.repeat){

                flip();

            }

        }

    }
);


/* =========================================================
   INITIAL UI
========================================================= */

message.textContent =
    "Best " +
    highScore;


/* =========================================================
   SPAWN
========================================================= */

function spawn(){

    const X =
        W + 60;

    const r =
        random();

    const trackLength =
        bot - top;

    const side =
        random() < .5
            ? 1
            : -1;

    let delay =
        .55 +
        random() * .45;


    if(r < .34){

        const n =
            1 +
            (random() * 3 | 0);

        obstacles.push({

            type:"spike",

            x:X,

            width:30 * n,

            height:34,

            side:side

        });

        delay +=
            n * .06;

    }

    else if(r < .58){

        obstacles.push({

            type:"wall",

            x:X,

            width:38,

            height:
                trackLength *
                (.4 + random() * .15),

            side:side

        });

    }

    else if(r < .78){

        obstacles.push({

            type:"orbObstacle",

            x:X,

            radius:20,

            phase:random() * 6,

            amplitude:
                trackLength * .32

        });

    }

    else{

        obstacles.push({

            type:"wall",

            x:X,

            width:38,

            height:
                trackLength * .45,

            side:side

        });

        obstacles.push({

            type:"wall",

            x:
                X +
                speed() * .62,

            width:38,

            height:
                trackLength * .45,

            side:-side

        });

        delay += .45;

    }


    if(random() < .6){

        orbs.push({

            x:
                X +
                speed() *
                delay *
                .5,

            y:
                random() < .5
                    ? top + 26
                    : bot - 26,

            radius:11,

            phase:
                random() * 6

        });

    }


    spawnGap =
        speed() *
        (.5 + delay * .7);

}


/* =========================================================
   COLLISION
========================================================= */

function hitObstacle(obstacle){

    const px =
        playerX() - 12;

    const py =
        playerY - 12;

    const width = 24;

    const height = 24;


    if(
        obstacle.type ===
        "orbObstacle"
    ){

        const centerY =
            (top + bot) / 2 +
            Math.sin(
                obstacle.phase
            ) *
            obstacle.amplitude;

        const dx =
            Math.max(
                px,
                Math.min(
                    obstacle.x,
                    px + width
                )
            ) -
            obstacle.x;

        const dy =
            Math.max(
                py,
                Math.min(
                    centerY,
                    py + height
                )
            ) -
            centerY;

        return (
            dx * dx +
            dy * dy <
            (obstacle.radius - 3) ** 2
        );

    }


    const base =
        obstacle.side === 1
            ? bot
            : top;


    let y0;
    let y1;


    if(
        obstacle.type ===
        "spike"
    ){

        const h =
            obstacle.height *
            .7;

        y0 =
            obstacle.side === 1
                ? base - h
                : base;

        y1 =
            obstacle.side === 1
                ? base
                : base + h;

        return (
            px + width >
                obstacle.x + 4 &&
            px <
                obstacle.x +
                obstacle.width - 4 &&
            py + height > y0 &&
            py < y1
        );

    }


    y0 =
        obstacle.side === 1
            ? base - obstacle.height
            : base;

    y1 =
        obstacle.side === 1
            ? base
            : base + obstacle.height;


    return (
        px + width >
            obstacle.x &&
        px <
            obstacle.x +
            obstacle.width &&
        py + height > y0 &&
        py < y1
    );

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    time += dt;

    distance +=
        speed() * dt;

    flipBuffer -= dt;


    if(
        flipBuffer > 0 &&
        grounded
    ){

        direction *= -1;

        velocityY =
            direction * 140;

        grounded = false;

        flipBuffer = 0;

        sound(
            direction > 0
                ? 300
                : 500,
            .12,
            "square",
            .03,
            .6
        );

        explode(
            playerX(),
            playerY,
            "#ffffff",
            6,
            120
        );

        shake =
            Math.max(
                shake,
                3
            );

    }


    velocityY +=
        direction *
        acceleration() *
        dt;

    playerY +=
        velocityY *
        dt;


    rotation +=
        (
            (
                direction > 0
                    ? 0
                    : Math.PI
            ) -
            rotation
        ) *
        Math.min(
            1,
            dt * 14
        );


    if(
        direction === 1 &&
        playerY >= bot - 14
    ){

        playerY =
            bot - 14;

        velocityY = 0;

        grounded = true;

    }


    if(
        direction === -1 &&
        playerY <= top + 14
    ){

        playerY =
            top + 14;

        velocityY = 0;

        grounded = true;

    }


    spawnGap -=
        speed() * dt;

    if(spawnGap <= 0){

        spawn();

    }


    const movement =
        speed() * dt;


    for(
        const obstacle
        of obstacles
    ){

        obstacle.x -=
            movement;

        if(
            obstacle.type ===
            "orbObstacle"
        ){

            obstacle.phase +=
                dt *
                (2 + time * .04);

        }

    }


    for(
        const orb
        of orbs
    ){

        orb.x -=
            movement;

        orb.phase +=
            dt * 4;

    }


    particles.push({

        x:
            playerX() - 10,

        y:
            playerY +
            (random() - .5) * 14,

        vx:
            -speed() * .5,

        vy:
            (random() - .5) * 40,

        life:.35,

        maxLife:.35,

        color:"#0088ff"

    });


    for(
        const obstacle
        of obstacles
    ){

        if(
            hitObstacle(obstacle)
        ){

            gameOver();

            return;

        }

    }


    for(
        const orb
        of orbs
    ){

        if(
            !orb.collected &&
            Math.hypot(
                orb.x -
                    playerX(),
                orb.y -
                    playerY
            ) < 26
        ){

            orb.collected =
                true;

            orbCount++;

            combo++;

            explode(
                orb.x,
                orb.y,
                "#ffff00",
                10,
                160
            );

            sound(
                700 +
                    combo * 40,
                .15,
                "sine",
                .07,
                .8
            );

        }

    }


    obstacles =
        obstacles.filter(
            obstacle =>
                obstacle.x +
                (
                    obstacle.width ||
                    40
                ) >
                -60
        );


    orbs =
        orbs.filter(
            orb =>
                !orb.collected &&
                orb.x > -30
        );


    score =
        (
            distance / 60 |
            0
        ) +
        orbCount * 10;

}


/* =========================================================
   GLOW
========================================================= */

function glow(
    color,
    width = 2
){

    ctx.globalAlpha = .25;

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        width * 3.5;

    ctx.stroke();

    ctx.globalAlpha = 1;

    ctx.lineWidth =
        width;

    ctx.stroke();

}


/* =========================================================
   DRAW
========================================================= */

function draw(dt){

    const hue =
        (time * 6 + 200) % 360;

    const color1 =
        `hsl(${hue},100%,60%)`;

    const color2 =
        `hsl(${(hue + 150) % 360},100%,62%)`;


    const background =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    background.addColorStop(
        0,
        `hsl(${hue},60%,10%)`
    );

    background.addColorStop(
        1,
        `hsl(${(hue + 60) % 360},60%,6%)`
    );

    ctx.fillStyle =
        background;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.save();


    if(shake > .4){

        ctx.translate(
            (random() - .5) *
                shake,
            (random() - .5) *
                shake
        );

        shake *= .88;

    }


    const currentSpeed =
        state === "play" ||
        state === "dead"
            ? speed()
            : 120;


    /* STARS */

    ctx.fillStyle =
        "#ffffff";

    for(
        const star
        of stars
    ){

        star.x -=
            star.z *
            currentSpeed *
            .12 *
            dt;

        if(star.x < 0){

            star.x = W;

            star.y =
                random() * H;

        }

        ctx.globalAlpha =
            .25 +
            star.z * .3;

        ctx.fillRect(
            star.x,
            star.y,
            star.z * 2 +
                currentSpeed * .004,
            star.z * 1.5
        );

    }

    ctx.globalAlpha = 1;


    /* GRID */

    ctx.globalCompositeOperation =
        "lighter";

    ctx.strokeStyle =
        color1;

    ctx.globalAlpha = .08;

    ctx.lineWidth = 1;

    const offset =
        (distance * .5) % 90;


    for(
        let i = -1;
        i < W / 90 + 1;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            i * 90 - offset,
            top
        );

        ctx.lineTo(
            i * 90 - offset,
            bot
        );

        ctx.stroke();

    }

    ctx.globalAlpha = 1;


    /* TRACK */

    ctx.beginPath();

    ctx.moveTo(
        0,
        top
    );

    ctx.lineTo(
        W,
        top
    );

    ctx.moveTo(
        0,
        bot
    );

    ctx.lineTo(
        W,
        bot
    );

    glow(
        color1,
        3
    );


    /* ORBS */

    for(
        const orb
        of orbs
    ){

        ctx.beginPath();

        ctx.arc(
            orb.x,
            orb.y,
            orb.radius +
                Math.sin(
                    orb.phase
                ) * 2,
            0,
            TWO_PI
        );

        glow("#ffff00");

        ctx.fillStyle =
            "#ffff00";

        ctx.globalAlpha = .4;

        ctx.fill();

        ctx.globalAlpha = 1;

    }


    /* OBSTACLES */

    for(
        const obstacle
        of obstacles
    ){

        ctx.beginPath();


        if(
            obstacle.type ===
            "spike"
        ){

            const count =
                Math.round(
                    obstacle.width /
                    30
                );

            const base =
                obstacle.side === 1
                    ? bot
                    : top;


            for(
                let i = 0;
                i < count;
                i++
            ){

                ctx.moveTo(
                    obstacle.x +
                        i * 30,
                    base
                );

                ctx.lineTo(
                    obstacle.x +
                        i * 30 +
                        15,
                    base -
                        obstacle.side *
                        obstacle.height
                );

                ctx.lineTo(
                    obstacle.x +
                        i * 30 +
                        30,
                    base
                );

            }

            ctx.closePath();

            glow(
                "#ff3333",
                2
            );

            ctx.fillStyle =
                "#ff3333";

            ctx.globalAlpha = .3;

            ctx.fill();

            ctx.globalAlpha = 1;

        }


        else if(
            obstacle.type ===
            "wall"
        ){

            const y =
                obstacle.side === 1
                    ? bot -
                        obstacle.height
                    : top;

            ctx.rect(
                obstacle.x,
                y,
                obstacle.width,
                obstacle.height
            );

            glow(
                color2,
                2
            );

            ctx.fillStyle =
                color2;

            ctx.globalAlpha = .22;

            ctx.fill();

            ctx.globalAlpha = 1;

        }


        else{

            const centerY =
                (top + bot) / 2 +
                Math.sin(
                    obstacle.phase
                ) *
                obstacle.amplitude;

            ctx.save();

            ctx.translate(
                obstacle.x,
                centerY
            );

            ctx.rotate(
                time * 8
            );

            for(
                let i = 0;
                i < 8;
                i++
            ){

                const angle =
                    i * TWO_PI / 8;

                ctx.lineTo(
                    Math.cos(angle) *
                        obstacle.radius,
                    Math.sin(angle) *
                        obstacle.radius
                );

                ctx.lineTo(
                    Math.cos(
                        angle +
                        TWO_PI / 16
                    ) *
                        obstacle.radius *
                        .55,
                    Math.sin(
                        angle +
                        TWO_PI / 16
                    ) *
                        obstacle.radius *
                        .55
                );

            }

            ctx.closePath();

            glow(
                "#ff8800",
                2
            );

            ctx.fillStyle =
                "#ff8800";

            ctx.globalAlpha = .3;

            ctx.fill();

            ctx.globalAlpha = 1;

            ctx.restore();

        }

    }


    /* PARTICLES */

    for(
        const particle
        of particles
    ){

        particle.x +=
            particle.vx * dt;

        particle.y +=
            particle.vy * dt;

        particle.life -= dt;

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life /
                    particle.maxLife
            );

        ctx.fillStyle =
            particle.color;

        ctx.fillRect(
            particle.x - 2,
            particle.y - 2,
            4,
            4
        );

    }

    ctx.globalAlpha = 1;

    particles =
        particles.filter(
            particle =>
                particle.life > 0
        );


    /* PLAYER */

    if(
        state !== "dead" &&
        playerY !== undefined &&
        state !== "menu"
    ){

        ctx.save();

        ctx.translate(
            playerX(),
            playerY
        );

        ctx.rotate(
            rotation +
            (
                grounded
                    ? 0
                    : (
                        direction > 0
                            ? -1
                            : 1
                    ) *
                    Math.min(
                        .5,
                        Math.abs(
                            velocityY
                        ) / 2500
                    )
            )
        );


        ctx.beginPath();

        ctx.rect(
            -13,
            -13,
            26,
            26
        );

        glow(
            "#00ffff",
            3
        );

        ctx.fillStyle =
            "#00ffff";

        ctx.globalAlpha = .3;

        ctx.fill();

        ctx.globalAlpha = 1;

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            2,
            direction > 0
                ? -6
                : 2,
            7,
            5
        );

        ctx.restore();

    }


    ctx.restore();

    ctx.globalCompositeOperation =
        "source-over";


    /* FLASH */

    if(flash > 0){

        ctx.fillStyle =
            `rgba(255,255,255,${flash * .5})`;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        flash -=
            dt * 2;

    }


    /* SCORE */

    if(
        state === "play" ||
        state === "dead"
    ){

        ctx.textAlign =
            "center";

        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "700 30px system-ui";

        ctx.fillText(
            score,
            W / 2,
            top - 10 < 30
                ? 30
                : top - 12
        );


        ctx.textAlign =
            "left";

        ctx.font =
            "13px system-ui";

        ctx.fillStyle =
            "#aaaaaa";

        ctx.fillText(
            "BEST " +
            Math.max(
                highScore,
                score
            ) +
            "   ●" +
            orbCount,
            14,
            bot + 30 > H
                ? H - 8
                : bot + 26
        );

    }

}


/* =========================================================
   STARS
========================================================= */

const stars =
    Array.from(
        {
            length:70
        },
        () => ({

            x:
                random() *
                window.innerWidth,

            y:
                random() *
                window.innerHeight,

            z:
                .3 +
                random()

        })
    );


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime = 0;


function gameLoop(timestamp){

    requestAnimationFrame(
        gameLoop
    );


    let dt =
        Math.min(
            (timestamp - lastTime) /
                1000 ||
                0,
            .05
        );

    lastTime =
        timestamp;


    if(state === "dead"){

        deadTimer += dt;

        slowMotion =
            Math.min(
                1,
                slowMotion +
                    dt * .6
            );

        dt *=
            slowMotion;


        if(
            deadTimer > .7 &&
            ui.classList.contains(
                "hidden"
            )
        ){

            showEnd();

        }

    }


    if(state === "play"){

        update(dt);

    }


    draw(dt);

}


requestAnimationFrame(
    gameLoop
);


/* =========================================================
   SERVICE WORKER
========================================================= */

/*
   Service worker is optional.
   It cannot prevent the game from starting.
*/

if(
    "serviceWorker" in navigator
){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register(
                    "./sw.js"
                )
                .catch(
                    function(){}
                );

        }
    );

}
